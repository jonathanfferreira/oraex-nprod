# =============================================================================
# ORAEX MASTER PLAYBOOK
# -----------------------------------------------------------------------------
# Orquestrador principal para provisionamento de ambientes Oracle Database.
# Suporta Single Instance e RAC através de Roles modulares.
# =============================================================================
- name: ORAEX Infrastructure Provisioning
  hosts: all
  become: yes
  vars:
    # Definições Globais (podem ser sobrescritas pelo Ansible Tower/Extra Vars)
    oracle_edition: "EE"
    oracle_version: "19c"
    install_grid: true
    install_db: true
    configure_db: true

    # Paths Padrão (Overridable)
    oracle_base: /u01/app/oracle
    oracle_home: /u01/app/oracle/product/19.0.0/dbhome_1
    grid_home: /u01/app/19.0.0/grid

  tasks:
    # -------------------------------------------------------------------------
    # 1. Bootstrap do Sistema Operacional (Common Layer)
    # -------------------------------------------------------------------------
    - name: Apply OS Bootstrap Role
      include_role:
        name: oraex_os_bootstrap

    # -------------------------------------------------------------------------
    # 2. Grid Infrastructure (Cluster Layer)
    # -------------------------------------------------------------------------
    - name: Apply Grid Install Role
      include_role:
        name: oraex_grid_install
      when: install_grid | bool

    # -------------------------------------------------------------------------
    # 3. Database Software (Binaries Layer)
    # -------------------------------------------------------------------------
    - name: Apply DB Install Role
      include_role:
        name: oraex_db_install
      when: install_db | bool

    # -------------------------------------------------------------------------
    # 4. Database Creation (Instance Layer)
    # -------------------------------------------------------------------------
    - name: Apply DB Configuration Role
      include_role:
        name: oraex_db_config
      when: configure_db | bool
