---
- name: Verify ASM Environment (Client Check)
  hosts: standalone
  become: yes
  become_user: grid
  vars:
    grid_home: /u01/app/19.0.0/grid
  tasks:
    - name: Run ASMCMD with Explicit Env
      shell: |
        export ORACLE_SID=+ASM
        export ORACLE_HOME={{ grid_home }}
        export PATH=$ORACLE_HOME/bin:$PATH
        asmcmd lsdg
      register: asm_out
      
    - name: Show ASM Output
      debug:
        msg: "{{ asm_out.stdout_lines }}"
