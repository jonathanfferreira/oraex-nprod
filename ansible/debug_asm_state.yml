---
- name: Debug ASM Resource State
  hosts: standalone
  tasks:
    - name: Check All Cluster Resources
      become: yes
      shell: /u01/app/19.0.0/grid/bin/crsctl stat res -t
      register: crs_stat
      ignore_errors: yes

    - name: Check ASM Configuration via SRVCTL
      become: yes
      become_user: grid
      shell: /u01/app/19.0.0/grid/bin/srvctl status asm -a
      register: srv_stat
      ignore_errors: yes

    - name: Show Debug Info
      debug:
        msg:
          - "CRS Resource Status: {{ crs_stat.stdout_lines }}"
          - "SRVCTL ASM Status: {{ srv_stat.stdout_lines }}"
