---
- name: Force Start ASM and Mount DATA
  hosts: standalone
  become: yes
  become_user: grid
  vars:
    grid_home: /u01/app/19.0.0/grid
  tasks:
    - name: Check ASM Status (SRVCTL)
      shell: "{{ grid_home }}/bin/srvctl status asm"
      register: srv_status
      ignore_errors: yes

    - name: Start ASM Instance (SRVCTL)
      shell: "{{ grid_home }}/bin/srvctl start asm"
      when: "'is running' not in srv_status.stdout"
      ignore_errors: yes

    - name: Check Disk Group Status (ASMCMD)
      shell: |
        export ORACLE_SID=+ASM
        export ORACLE_HOME={{ grid_home }}
        {{ grid_home }}/bin/asmcmd lsdg
      register: lsdg_out
      ignore_errors: yes

    - name: Mount DATA Disk Group (if passed)
      shell: |
        export ORACLE_SID=+ASM
        export ORACLE_HOME={{ grid_home }}
        {{ grid_home }}/bin/asmcmd mount DATA
      when: "'MOUNTED' not in lsdg_out.stdout"
      ignore_errors: yes

    - name: Final Verify
      shell: |
        export ORACLE_SID=+ASM
        export ORACLE_HOME={{ grid_home }}
        {{ grid_home }}/bin/asmcmd lsdg
      register: final_lsdg

    - name: Show Results
      debug:
        msg: 
          - "SRVCTL: {{ srv_status.stdout }}"
          - "Final Storage: {{ final_lsdg.stdout_lines }}"
