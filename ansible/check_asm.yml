---
- name: Check ASM Visibility and Permissions
  hosts: standalone
  tasks:
    - name: Check 'oracle' user groups
      shell: id oracle
      register: id_out

    - name: Check running ASM/PMON processes
      shell: ps -ef | grep pmon | grep -v grep
      ignore_errors: yes
      register: pmon_out

    - name: Check ASM Disk Group (as Grid User)
      become: yes
      become_user: grid
      shell: |
        . /home/grid/.bash_profile
        /u01/app/19.0.0/grid/bin/asmcmd lsdg
      register: asm_out
      ignore_errors: yes

    - name: Check /dev/loop Permissions
      shell: ls -l /dev/loop*
      register: dev_out

    - name: Check /etc/oratab Content
      shell: cat /etc/oratab
      register: oratab_out

    - name: Debug Output
      debug:
        msg:
          - "User Oracle Groups: {{ id_out.stdout }}"
          - "PMON Processes: {{ pmon_out.stdout_lines }}"
          - "ASM Disk Groups: {{ asm_out.stdout_lines | default('ASM CMD FAILED') }}"
          - "Disk Permissions: {{ dev_out.stdout_lines }}"
          - "Oratab Content: {{ oratab_out.stdout_lines }}"
