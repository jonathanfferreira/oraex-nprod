---
- name: restart listener
  become: yes
  shell: |
    # Check if Grid is installed (srvctl exists)
    if [ -f "/u01/app/19.0.0/grid/bin/srvctl" ]; then
      echo "Grid Infrastructure detected. Using SRVCTL."
      /u01/app/19.0.0/grid/bin/srvctl stop listener
      /u01/app/19.0.0/grid/bin/srvctl start listener
    else
      # Standalone DB without Grid
      echo "No Grid detected. Using LSNRCTL."
      su - {{ oracle_user }} -c "{{ oracle_home }}/bin/lsnrctl stop"
      su - {{ oracle_user }} -c "{{ oracle_home }}/bin/lsnrctl start"
    fi
  ignore_errors: yes
