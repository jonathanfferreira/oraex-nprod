---
# =========================================================================
# RESET ASM and Configure Disk Group
# -------------------------------------------------------------------------
# Tarefa opcional para garantir que o ASM esteja usando o disco correto (20GB).
# =========================================================================

- name: Stop ASM Instance (Force)
  shell: /u01/app/19.0.0/grid/bin/crsctl stop has -f
  ignore_errors: yes

    - name: Wipe ASM Disk Headers (loop0 and loop1)
      # Run as root. Clean both candidates to avoid conflict.
      shell: dd if=/dev/zero of={{ item }} bs=1M count=10 conv=notrunc
      loop:
        - /dev/loop0
        - /dev/loop1
        - /dev/loop2
        - /dev/loop3
        - /dev/loop4
        - /dev/loop5

    - name: Start HAS (High Availability Services)
      shell: /u01/app/19.0.0/grid/bin/crsctl start has
      ignore_errors: yes

    - name: Configure ASM using 20GB Disk (/dev/loop1)
      become_user: grid
      shell: |
        {{ grid_home }}/bin/asmca -silent -configureASM \
        -sysAsmPassword '{{ sys_asm_pass }}' \
        -asmsnmpPassword '{{ asm_snmp_pass }}' \
        -diskString '/dev/loop1' \
        -diskGroupName DATA \
        -disk '/dev/loop1' \
        -redundancy EXTERNAL \
        -au_size 4
      register: asmca_out
      
    - name: Show ASMCA Output
      debug:
        msg: "{{ asmca_out.stdout_lines }}"

    - name: Verify ASM Resource
      become_user: grid
      shell: "{{ grid_home }}/bin/crsctl stat res ora.asm -t"
      register: final_check

    - name: Check Disk Group Free Space
      become_user: grid
      shell: |
        . /home/grid/.bash_profile
        {{ grid_home }}/bin/asmcmd lsdg
      register: lsdg_out

    - name: Show Final Status
      debug:
        msg: 
          - "{{ final_check.stdout_lines }}"
          - "{{ lsdg_out.stdout_lines }}"
