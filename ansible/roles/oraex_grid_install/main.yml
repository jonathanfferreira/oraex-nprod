---
# =========================================================================
# 1. Pré-Requisitos Específicos do Grid
# -------------------------------------------------------------------------
# 'expect': Usado para automação interativa se necessário.
# 'cvuqdisk': RPM proprietário da Oracle necessário para o Clusterware ver discos compartilhados.
# =========================================================================
- name: Install Unzip and Expect (Prereqs)
  yum:
    name: 
      - unzip
      - expect
    state: present

    # O Grid Home DEVE ser separado do Oracle Base. 
    # É onde o software do Clusterware fica instalado.
    - name: Create Grid Home Directory
      file:
        path: "{{ grid_home }}"
        state: directory
        owner: "{{ grid_user }}"
        group: oinstall
        mode: '0775'

    # Descompactação do zip do Grid. 
    # Nota: O Grid Infrastructure é instalado "in-place" (descompacta e roda o setup de lá).
    - name: Unzip Grid Infrastructure Binaries
      unarchive:
        src: "{{ grid_zip }}"
        dest: "{{ grid_home }}"
        remote_src: yes
        owner: "{{ grid_user }}"
        group: oinstall
        creates: "{{ grid_home }}/gridSetup.sh"

    # RPM essencial para o C.V.U (Cluster Verification Utility) checar discos.
    # Sem isso, a verificação de disco falha.
    - name: Install cvuqdisk RPM
      yum:
        name: "{{ grid_home }}/cv/rpm/cvuqdisk-1.0.10-1.rpm"
        state: present
        disable_gpg_check: yes

    # =========================================================================
    # 2. Configuração e Instalação (Setup)
    # -------------------------------------------------------------------------
    # Geramos o arquivo de respostas com as configurações do Cluster (ou Standalone).
    # O comando 'gridSetup.sh' faz a mágica acontecer.
    # =========================================================================
    - name: Generate Response File (Template)
      template:
        src: "templates/grid_install.j2"
        dest: "{{ rsp_file_dest }}"
        owner: "{{ grid_user }}"
        group: oinstall
        mode: '0644'

    - name: Run Grid Setup (Silent)
      become: yes
      become_user: "{{ grid_user }}"
      environment:
        CV_ASSUME_DISTID: OEL7.6
        TMP: /tmp
        TEMP: /tmp
      shell: |
         {{ grid_home }}/gridSetup.sh -silent -responseFile {{ rsp_file_dest }} -ignorePrereq -waitforcompletion
      register: grid_setup
      # RC 0 = Sucesso, RC 6 = Sucesso com Warnings
      failed_when: grid_setup.rc not in [0, 6]


    # Scripts que PRECISAM ser rodados como ROOT após a instalação.
    # 1. orainstRoot.sh: Cria o arquivo /etc/oraInst.loc (Inventário Central)
    # 2. root.sh: Configura o Stack do Clusterware, sobe os serviços e o ASM.
    - name: Run orainstRoot.sh
      shell: /u01/app/oraInventory/orainstRoot.sh
      register: orainst_out

    - name: Run root.sh (This acts as the configuration step)
      shell: "{{ grid_home }}/root.sh"
      register: root_out
      
    - name: Show Root Execution Output
      debug:
        msg: 
          - "{{ orainst_out.stdout_lines }}"
          - "{{ root_out.stdout_lines }}"

    # Fase final: Registra ferramentas e listeners no cluster.
    - name: Config Tool All (Optional post-root)
      become: yes
      become_user: "{{ grid_user }}"
      shell: "{{ grid_home }}/gridSetup.sh -executeConfigTools -responseFile {{ rsp_file_dest }} -silent"
      ignore_errors: yes

    # =========================================================================
    # 3. ASM Disk Group Creation
    # -------------------------------------------------------------------------
    # Importa a lógica de limpeza e criação do Disk Group DATA (20GB).
    # =========================================================================
    - name: Configure ASM Disk Group
      import_tasks: tasks/configure_asm.yml
      # when: configure_asm | bool (Pode ser parametrizável)
