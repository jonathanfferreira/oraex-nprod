---
# ==============================================================================
# Role: oraex_housekeeper
# Descrição: Deploy de scripts de limpeza e sustentação
# ==============================================================================

- name: Copiar scripts de sustentação
  copy:
    src: "{{ item }}"
    dest: "{{ oraex_automation_dir }}/sustentacao/"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0750'
  loop:
    - ../../../automacao/sustentacao/oracle_housekeeper.py
    - ../../../automacao/sustentacao/smart_log_rotate.py
    - ../../../automacao/sustentacao/autorestart_goldengate.py

- name: Agendar housekeeper (semanal - domingo)
  cron:
    name: "ORAEX - Housekeeper"
    user: "{{ oracle_user }}"
    minute: "0"
    hour: "{{ housekeeper_hour }}"
    weekday: "{{ housekeeper_day }}"
    job: "{{ python_executable }} {{ oraex_automation_dir }}/sustentacao/oracle_housekeeper.py --inventory {{ oracle_inventory }} {% if not housekeeper_dry_run %}--force --confirm-delete{% endif %} >> {{ oraex_log_dir }}/housekeeper.log 2>&1"

- name: Agendar log rotate (diário - madrugada)
  cron:
    name: "ORAEX - Log Rotate"
    user: "{{ oracle_user }}"
    minute: "30"
    hour: "3"
    job: "{{ python_executable }} {{ oraex_automation_dir }}/sustentacao/smart_log_rotate.py --days {{ log_retention_days }} >> {{ oraex_log_dir }}/logrotate.log 2>&1"

- name: Agendar GoldenGate auto-restart (a cada 5 minutos)
  cron:
    name: "ORAEX - GoldenGate AutoRestart"
    user: "{{ oracle_user }}"
    minute: "*/5"
    job: "{{ python_executable }} {{ oraex_automation_dir }}/sustentacao/autorestart_goldengate.py >> {{ oraex_log_dir }}/goldengate.log 2>&1"
  when: deploy_goldengate | default(false)
