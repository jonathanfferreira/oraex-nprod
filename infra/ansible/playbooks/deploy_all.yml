---
# ==============================================================================
# ORAEX - Deploy Completo
# ==============================================================================
# Uso: ansible-playbook playbooks/deploy_all.yml -i inventory/production.ini
# Dry-run: ansible-playbook playbooks/deploy_all.yml --check --diff
# ==============================================================================

- name: Deploy ORAEX Automation Suite
  hosts: oracle_servers
  become: yes
  become_user: root

  pre_tasks:
    - name: Exibir informações do servidor
      debug:
        msg: |
          Servidor: {{ inventory_hostname }}
          OS: {{ ansible_distribution }} {{ ansible_distribution_version }}
          Kernel: {{ ansible_kernel }}

  roles:
    - role: oraex_base
      tags: [base, always]

    - role: oraex_monitoring
      when: deploy_monitoring | default(true)
      tags: [monitoring]

    - role: oraex_healthcheck
      when: deploy_healthcheck | default(true)
      tags: [healthcheck]

    - role: oraex_housekeeper
      when: deploy_housekeeper | default(true)
      tags: [housekeeper]

    - role: oraex_backup
      when: deploy_backup | default(true)
      tags: [backup]

  post_tasks:
    - name: Verificar instalação
      command: "ls -la {{ oraex_automation_dir }}"
      register: install_check
      changed_when: false

    - name: Exibir resumo
      debug:
        msg: |
          ✅ Deploy ORAEX concluído!
          Diretório: {{ oraex_automation_dir }}
          Logs: {{ oraex_log_dir }}
          
          Scripts instalados:
          {{ install_check.stdout_lines | join('\n') }}
