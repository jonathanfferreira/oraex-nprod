---
# ==============================================================================
# ORAEX - Rollback de Emergência
# ==============================================================================
# Uso: ansible-playbook playbooks/rollback.yml -i inventory/production.ini
# CUIDADO: Remove todos os componentes ORAEX do servidor!
# ==============================================================================

- name: Rollback ORAEX Installation
  hosts: oracle_servers
  become: yes
  become_user: root

  vars:
    confirm_rollback: false

  pre_tasks:
    - name: AVISO - Confirmação necessária
      fail:
        msg: |
          ⚠️ ROLLBACK DESTRUTIVO!
          
          Isso irá:
          - Remover todos os crontabs ORAEX
          - Remover diretório {{ oraex_automation_dir }}
          - Manter logs em {{ oraex_log_dir }}
          
          Para confirmar, execute com: -e confirm_rollback=true
      when: not confirm_rollback

  tasks:
    - name: Remover crontabs ORAEX
      cron:
        name: "{{ item }}"
        user: "{{ oracle_user }}"
        state: absent
      loop:
        - "ORAEX - Partition Check"
        - "ORAEX - Tablespace Check"
        - "ORAEX - Healthcheck"
        - "ORAEX - Housekeeper"
        - "ORAEX - Log Rotate"
        - "ORAEX - GoldenGate AutoRestart"
        - "ORAEX - RMAN Backup"

    - name: Backup do diretório antes de remover
      archive:
        path: "{{ oraex_automation_dir }}"
        dest: "{{ oraex_log_dir }}/rollback_backup_{{ ansible_date_time.epoch }}.tar.gz"
      ignore_errors: yes

    - name: Remover diretório de automação
      file:
        path: "{{ oraex_automation_dir }}"
        state: absent

    - name: Rollback concluído
      debug:
        msg: |
          ✅ Rollback concluído!
          Backup salvo em: {{ oraex_log_dir }}/rollback_backup_*.tar.gz
          Logs mantidos em: {{ oraex_log_dir }}
