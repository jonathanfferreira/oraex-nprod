# ==============================================================================
# Inventory Vagrant - Gerado automaticamente
# ==============================================================================
# Este inventory é usado pelo Vagrant para provisionar VMs com Ansible
# ==============================================================================

[oracle_rac_nodes]
oracle-rac-node1 ansible_host=192.168.56.11
oracle-rac-node2 ansible_host=192.168.56.12

[oracle_rac_nodes:vars]
ansible_user=vagrant
ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_key
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[mongodb_nodes]
mongodb-node ansible_host=192.168.56.20

[mongodb_nodes:vars]
ansible_user=vagrant
ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_key
ansible_ssh_common_args='-o StrictHostKeyChecking=no'

[test_nodes]
test-node ansible_host=192.168.56.30

[test_nodes:vars]
ansible_user=vagrant
ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_key
ansible_ssh_common_args='-o StrictHostKeyChecking=no'
