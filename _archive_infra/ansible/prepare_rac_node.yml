---
- name: Prepare Linux for Oracle RAC 19c Installation
  hosts: rac_nodes
  become: yes
  vars:
    oracle_user: "oracle"
    grid_user: "grid"
    oinstall_group: "oinstall"
    dba_group: "dba"
    asmadmin_group: "asmadmin"

  tasks:
    - name: 1. Install Pre-requisite Packages (Oracle preinstall rpm)
      yum:
        name: oracle-database-preinstall-19c
        state: present
    
    - name: 2. Install Additional Packages (from PDF)
      yum:
        name:
          - xorg-x11-xauth
          - xterm
          - ksh 
          - libaio-devel
        state: present

    - name: 3. Create Oracle Groups
      group:
        name: "{{ item }}"
        state: present
      loop:
        - "{{ oinstall_group }}"
        - "{{ dba_group }}"
        - "{{ asmadmin_group }}"

    - name: 4. Create Users (Grid and Oracle)
      user:
        name: "{{ item.name }}"
        group: "{{ oinstall_group }}"
        groups: "{{ item.groups }}"
        shell: /bin/bash
      loop:
        - { name: "{{ grid_user }}", groups: "{{ asmadmin_group }},{{ dba_group }}" }
        - { name: "{{ oracle_user }}", groups: "{{ dba_group }}" }

    - name: 5. Create Directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ grid_user }}"
        group: "{{ oinstall_group }}"
        mode: '0775'
      loop:
        - "/u01/app/grid"
        - "/u01/app/oracle"
        - "/u02/oracle/patches"

    - name: 6. Configure Kernel Parameters (sysctl)
      sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        state: present
        reload: yes
      loop:
        - { key: 'fs.file-max', value: '6815744' }
        - { key: 'kernel.shmall', value: '1073741824' }
        
    - name: 7. Disable Firewall (Firewalld)
      service:
        name: firewalld
        state: stopped
        enabled: no
