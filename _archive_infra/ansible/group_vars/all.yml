# ==============================================================================
# ORAEX - Variáveis Globais (Todos os Servidores)
# ==============================================================================

# Diretórios de instalação
oraex_base_dir: /opt/oraex
oraex_automation_dir: "{{ oraex_base_dir }}/automation"
oraex_log_dir: /var/log/oraex
oraex_backup_dir: "{{ oraex_base_dir }}/backups"

# Usuário e grupo Oracle
oracle_user: oracle
oracle_group: oinstall
dba_group: dba

# Python
python_executable: /usr/bin/python3
pip_executable: /usr/bin/pip3

# Dependências Python
python_packages:
  - cx_Oracle

# Logs
log_retention_days: 30

# Alertas (para integração futura)
alert_email: dba-team@getnet.com.br
alert_threshold_tablespace: 85
alert_threshold_asm: 80

# Tags para controle de deploy
deploy_monitoring: true
deploy_healthcheck: true
deploy_housekeeper: true
deploy_backup: true
