---
# ==============================================================================
# Instalação Oracle 19c
# ==============================================================================
# Nota: Esta task assume que o instalador Oracle já está disponível
# (via NFS, local, ou download)
# ==============================================================================

- name: Verificar se instalador Oracle existe
  stat:
    path: "{{ oracle_installer_path | default('/u02/oracle/installer') }}"
  register: installer_check
  tags: [install, check]

- name: Falhar se instalador não encontrado
  fail:
    msg: "Instalador Oracle não encontrado em {{ oracle_installer_path | default('/u02/oracle/installer') }}. Configure oracle_installer_path."
  when: not installer_check.stat.exists
  tags: [install, check]

- name: Criar diretório de resposta (response file)
  file:
    path: "{{ oracle_response_dir | default('/u02/oracle/response') }}"
    state: directory
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0755'
  tags: [install, setup]

- name: Gerar response file para instalação Oracle
  template:
    src: db_install.rsp.j2
    dest: "{{ oracle_response_dir | default('/u02/oracle/response') }}/db_install.rsp"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0644'
  tags: [install, setup]

- name: Executar instalação Oracle (silent mode)
  shell: |
    cd {{ oracle_installer_path | default('/u02/oracle/installer') }}
    ./runInstaller -silent -responseFile {{ oracle_response_dir | default('/u02/oracle/response') }}/db_install.rsp -waitforcompletion
  become_user: "{{ oracle_user }}"
  environment:
    ORACLE_HOME: "{{ oracle_home }}"
    ORACLE_BASE: "{{ oracle_base }}"
  register: install_result
  async: 3600  # Timeout de 1 hora
  poll: 30     # Verificar a cada 30 segundos
  tags: [install, execute]
  # Nota: Em produção, pode ser necessário executar manualmente devido à complexidade

- name: Executar root.sh (se necessário)
  script: /u01/app/oracle/product/19.0.0/dbhome_1/root.sh
  when: install_result.changed and root_scripts_required | default(true)
  tags: [install, post-install]

- name: Verificar instalação Oracle
  command: "{{ oracle_home }}/bin/sqlplus -V"
  register: sqlplus_check
  changed_when: false
  failed_when: false
  tags: [install, validate]

- name: Exibir resultado da instalação
  debug:
    msg: |
      Instalação Oracle concluída!
      SQL*Plus: {{ sqlplus_check.stdout if sqlplus_check.rc == 0 else 'Não encontrado' }}
  tags: [install, validate]
