---
# ==============================================================================
# Role: oracle-install
# Descrição: Instalação completa Oracle 19c RAC
# ==============================================================================
# Esta role instala e configura Oracle 19c em ambiente RAC
# Baseado no Book DBA Getnet e melhores práticas Oracle
# ==============================================================================

- name: Incluir tasks de preparação do sistema
  include_tasks: prepare_system.yml
  tags: [oracle-install, prepare]

- name: Incluir tasks de instalação Oracle
  include_tasks: install_oracle.yml
  tags: [oracle-install, install]
  when: install_oracle | default(true)

- name: Incluir tasks de configuração RAC
  include_tasks: configure_rac.yml
  tags: [oracle-install, rac]
  when: configure_rac | default(true) and is_rac | default(false)

- name: Incluir tasks de validação
  include_tasks: validate_installation.yml
  tags: [oracle-install, validate]
