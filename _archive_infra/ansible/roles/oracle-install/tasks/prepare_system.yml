---
# ==============================================================================
# Preparação do Sistema para Oracle 19c
# ==============================================================================

- name: Verificar sistema operacional
  debug:
    msg: "Preparando sistema: {{ ansible_distribution }} {{ ansible_distribution_version }}"
  tags: [prepare, always]

- name: Instalar pacote preinstall Oracle
  yum:
    name: oracle-database-preinstall-19c
    state: present
  when: ansible_pkg_mgr == "yum"
  tags: [prepare, packages]

- name: Instalar pacotes adicionais necessários
  yum:
    name:
      - xorg-x11-xauth
      - xterm
      - ksh
      - libaio-devel
      - libnsl
      - libaio
      - smartmontools
    state: present
  when: ansible_pkg_mgr == "yum"
  tags: [prepare, packages]

- name: Criar grupos Oracle
  group:
    name: "{{ item }}"
    state: present
  loop:
    - "{{ oracle_group }}"
    - "{{ dba_group }}"
    - "{{ asmadmin_group | default('asmadmin') }}"
    - "{{ oper_group | default('oper') }}"
  tags: [prepare, users]

- name: Criar usuário Grid (para ASM)
  user:
    name: "{{ grid_user | default('grid') }}"
    group: "{{ oracle_group }}"
    groups: "{{ asmadmin_group | default('asmadmin') }},{{ dba_group }}"
    shell: /bin/bash
    home: /home/{{ grid_user | default('grid') }}
    create_home: yes
  when: is_rac | default(false)
  tags: [prepare, users]

- name: Criar usuário Oracle
  user:
    name: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    groups: "{{ dba_group }}"
    shell: /bin/bash
    home: /home/{{ oracle_user }}
    create_home: yes
  tags: [prepare, users]

- name: Criar diretórios Oracle
  file:
    path: "{{ item }}"
    state: directory
    owner: "{{ item.split('/')[3] == 'grid' and (grid_user | default('grid')) or oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0775'
  loop:
    - "{{ oracle_base | default('/u01/app/oracle') }}"
    - "{{ grid_base | default('/u01/app/grid') }}"
    - "{{ oracle_inventory_dir | default('/u01/app/oraInventory') }}"
    - "{{ oracle_patches_dir | default('/u02/oracle/patches') }}"
  tags: [prepare, directories]

- name: Configurar parâmetros de kernel (sysctl)
  sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: yes
    sysctl_set: yes
  loop:
    - { key: 'fs.file-max', value: '6815744' }
    - { key: 'kernel.sem', value: '250 32000 100 128' }
    - { key: 'kernel.shmmax', value: '4398046511104' }
    - { key: 'kernel.shmall', value: '1073741824' }
    - { key: 'kernel.shmmni', value: '4096' }
    - { key: 'fs.aio-max-nr', value: '1048576' }
    - { key: 'net.ipv4.ip_local_port_range', value: '9000 65500' }
    - { key: 'net.core.rmem_default', value: '262144' }
    - { key: 'net.core.rmem_max', value: '4194304' }
    - { key: 'net.core.wmem_default', value: '262144' }
    - { key: 'net.core.wmem_max', value: '1048576' }
  tags: [prepare, kernel]

- name: Configurar limites de usuário (limits.conf)
  lineinfile:
    path: /etc/security/limits.conf
    line: "{{ item }}"
    regexp: "^{{ item.split()[0] }}\\s+{{ item.split()[1] }}\\s+"
    state: present
  loop:
    - "{{ oracle_user }} soft nofile 1024"
    - "{{ oracle_user }} hard nofile 65536"
    - "{{ oracle_user }} soft nproc 16384"
    - "{{ oracle_user }} hard nproc 16384"
    - "{{ oracle_user }} soft stack 10240"
    - "{{ oracle_user }} hard stack 32768"
    - "{{ grid_user | default('grid') }} soft nofile 1024"
    - "{{ grid_user | default('grid') }} hard nofile 65536"
    - "{{ grid_user | default('grid') }} soft nproc 16384"
    - "{{ grid_user | default('grid') }} hard nproc 16384"
  when: grid_user is defined or is_rac | default(false)
  tags: [prepare, limits]

- name: Desabilitar SELinux (se necessário)
  selinux:
    state: permissive
  when: ansible_selinux.status == "enabled"
  tags: [prepare, security]

- name: Desabilitar firewall (apenas para RAC interno)
  service:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop:
    - firewalld
    - iptables
  when: disable_firewall | default(false)
  tags: [prepare, security]

- name: Configurar variáveis de ambiente Oracle
  template:
    src: oracle_env.sh.j2
    dest: "/home/{{ oracle_user }}/.bash_profile"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0644'
  tags: [prepare, environment]
