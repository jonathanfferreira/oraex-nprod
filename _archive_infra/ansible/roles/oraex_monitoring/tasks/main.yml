---
# ==============================================================================
# Role: oraex_monitoring
# Descrição: Deploy de scripts de monitoramento (partições, tablespaces)
# ==============================================================================

- name: Copiar scripts de monitoramento
  copy:
    src: "{{ item }}"
    dest: "{{ oraex_automation_dir }}/monitoramento/"
    owner: "{{ oracle_user }}"
    group: "{{ oracle_group }}"
    mode: '0750'
  loop:
    - ../../../automacao/monitoramento/check_partitioning.py
    - ../../../automacao/monitoramento/check_tablespaces.py

- name: Agendar verificação de partições (diário)
  cron:
    name: "ORAEX - Partition Check"
    user: "{{ oracle_user }}"
    minute: "0"
    hour: "8"
    job: "{{ python_executable }} {{ oraex_automation_dir }}/monitoramento/check_partitioning.py --months {{ partition_check_months_ahead }} >> {{ oraex_log_dir }}/partitioning.log 2>&1"

- name: Agendar verificação de tablespaces (a cada hora)
  cron:
    name: "ORAEX - Tablespace Check"
    user: "{{ oracle_user }}"
    minute: "0"
    job: "{{ python_executable }} {{ oraex_automation_dir }}/monitoramento/check_tablespaces.py --threshold {{ alert_threshold_tablespace }} >> {{ oraex_log_dir }}/tablespaces.log 2>&1"
