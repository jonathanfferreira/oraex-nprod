name: CI - Python Tests & Lint

on:
  push:
    branches: [main, develop]
    paths:
      - 'automacao/**'
      - 'tests/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]

jobs:
  lint:
    name: 🔍 Lint & Style Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install linting tools
        run: |
          pip install flake8 black isort mypy
      
      - name: Check formatting with Black
        run: |
          black --check --diff automacao/ || echo "::warning::Some files need formatting"
      
      - name: Check imports with isort
        run: |
          isort --check-only --diff automacao/ || echo "::warning::Imports need sorting"
      
      - name: Lint with flake8
        run: |
          flake8 automacao/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 automacao/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics

  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt || pip install cx_Oracle pytest pytest-cov
      
      - name: Run tests
        run: |
          python -m pytest tests/ -v --tb=short --ignore=tests/integration/ || echo "Tests completed"
        continue-on-error: true
      
      - name: Test module imports
        run: |
          python -c "from automacao.utils.connection import ConnectionConfig; print('✅ connection.py OK')"
          python -c "from automacao.utils.alerting import AlertManager; print('✅ alerting.py OK')"
          python -c "from automacao.runbooks.runner import RunbookRunner; print('✅ runner.py OK')"

  validate-sql:
    name: 📋 Validate SQL Scripts
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Check SQL syntax (basic)
        run: |
          echo "Validating SQL files..."
          for f in scripts/*.sql; do
            if [ -f "$f" ]; then
              echo "Checking: $f"
              # Basic check: file should not be empty and should contain SQL keywords
              if grep -qiE "(SELECT|CREATE|ALTER|INSERT|UPDATE|DELETE)" "$f"; then
                echo "✅ $f contains valid SQL keywords"
              else
                echo "⚠️ $f may be empty or invalid"
              fi
            fi
          done

  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install bandit
        run: pip install bandit
      
      - name: Run security scan
        run: |
          bandit -r automacao/ -ll --skip B101 || echo "::warning::Security issues found"
        continue-on-error: true

  build-status:
    name: ✅ Build Status
    runs-on: ubuntu-latest
    needs: [lint, test, validate-sql, security-scan]
    if: always()
    
    steps:
      - name: Check all jobs
        run: |
          echo "All CI checks completed!"
          echo "Lint: ${{ needs.lint.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "SQL: ${{ needs.validate-sql.result }}"
          echo "Security: ${{ needs.security-scan.result }}"
