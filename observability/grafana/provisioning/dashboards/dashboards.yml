# Grafana Dashboard Provisioning
# -------------------------------

apiVersion: 1

providers:
  - name: 'ORAEX Dashboards'
    orgId: 1
    folder: 'Oracle'
    folderUid: 'oracle'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards
