version: '3.8'

# ORAEX Observability Stack
# -------------------------
# Inclui Prometheus para coleta de métricas e Grafana para visualização.
# 
# Uso:
#   docker-compose -f observability/docker-compose.yml up -d
#
# Acessos:
#   - Grafana: http://localhost:3000 (admin/oraex123)
#   - Prometheus: http://localhost:9090
#   - Oracle Exporter: http://localhost:9161/metrics

services:
  # Prometheus - Coleta e armazena métricas
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: oraex-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules/:/etc/prometheus/rules/:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - oraex-net

  # Grafana - Visualização de métricas
  grafana:
    image: grafana/grafana:10.2.0
    container_name: oraex-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=oraex123
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/oracle-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - oraex-net

  # Oracle Exporter - Coleta métricas do Oracle e expõe para Prometheus
  oracle-exporter:
    build:
      context: ..
      dockerfile: observability/Dockerfile.exporter
    container_name: oraex-oracle-exporter
    restart: unless-stopped
    ports:
      - "9161:9161"
    environment:
      - ORACLE_DSN=${ORACLE_DSN:-oracle-db:1521/orcl}
      - ORACLE_USER=${ORACLE_USER:-system}
      - ORACLE_PASSWORD=${ORACLE_PASSWORD:-oracle}
    networks:
      - oraex-net

  # AlertManager - Gerenciamento de alertas (opcional)
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: oraex-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      - oraex-net

networks:
  oraex-net:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
