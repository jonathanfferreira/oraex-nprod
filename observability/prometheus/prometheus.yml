# Prometheus Configuration for ORAEX
# -----------------------------------

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    monitor: 'oraex-monitor'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - /etc/prometheus/rules/*.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Oracle Database metrics
  - job_name: 'oracle'
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets: ['oracle-exporter:9161']
        labels:
          env: 'nprod'
          database: 'orcl'

  # Adicionar mais targets Oracle aqui
  # - job_name: 'oracle-prod'
  #   static_configs:
  #     - targets: ['oracle-exporter-prod:9161']
  #       labels:
  #         env: 'prod'
